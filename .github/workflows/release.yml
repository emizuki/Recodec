name: Release

# Push a tag `vX.Y.Z` (it must equal MARKETING_VERSION in project.yml) to build, sign, notarize and publish
# a GitHub release. Run the workflow by hand to rehearse: everything except `gh release create`.
#
# macOS runners cost ten times a Linux one, so the macOS job does only what needs macOS. Every check that
# can fail for a reason other than the build (tag, secrets, certificate, tests) runs first on Linux.
# The tests are not repeated here: the tagged commit must already have a green `Tests` run.
#
# Secrets (names only): APPLE_CERT_P12 (base64 of the Developer ID Application .p12), APPLE_CERT_PASSWORD,
# APPLE_API_KEY_P8 (the App Store Connect API key, PEM text), APPLE_API_KEY_ID, APPLE_API_ISSUER_ID.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"$/\1/p' project.yml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::MARKETING_VERSION in project.yml is '$version', not X.Y.Z"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag is a tested commit on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$state" in identical|behind) ;; *) echo "::error::$GITHUB_SHA is not on main (compare says: $state)"; exit 1 ;; esac
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$green" -ge 1 ] || { echo "::error::no green Tests run for $GITHUB_SHA; run the Tests workflow on this commit first"; exit 1; }

      # Cheap to fail here: a missing secret, a mangled p12, a wrong password or an expiring certificate
      # would otherwise cost macOS minutes. Nothing about the certificate is printed except its expiry date.
      - name: Signing secrets are present and usable
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=()
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          [ ${#missing[@]} -eq 0 ] || { echo "::error::missing repository secrets: ${missing[*]}"; exit 1; }

          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" \
            || { echo "::error::APPLE_CERT_P12 is not base64"; exit 1; }
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:APPLE_CERT_PASSWORD -nokeys -clcerts -out "$RUNNER_TEMP/leaf.pem" 2> /dev/null \
            || { echo "::error::APPLE_CERT_P12 cannot be opened with APPLE_CERT_PASSWORD"; exit 1; }
          openssl x509 -in "$RUNNER_TEMP/leaf.pem" -noout -subject | grep -q "Developer ID Application" \
            || { echo "::error::the certificate is not a Developer ID Application certificate"; exit 1; }
          openssl x509 -in "$RUNNER_TEMP/leaf.pem" -noout -checkend 2592000 > /dev/null \
            || { echo "::error::the certificate expires within 30 days or has expired"; exit 1; }
          openssl x509 -in "$RUNNER_TEMP/leaf.pem" -noout -enddate
          printf '%s' "$APPLE_API_KEY_P8" | openssl pkey -noout 2> /dev/null \
            || { echo "::error::APPLE_API_KEY_P8 is not a PEM private key"; exit 1; }

  release:
    needs: check
    runs-on: macos-latest
    # A notarization that never answers would otherwise bill for six hours.
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Recodec.xcodeproj -scheme Recodec -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO -quiet build
          app="$RUNNER_TEMP/dd/Build/Products/Release/Recodec.app"
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$built" = "$VERSION" ] || { echo "::error::the app says $built, project.yml says $VERSION"; exit 1; }
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "ARCHS=$(lipo -archs "$app/Contents/MacOS/Recodec")" >> "$GITHUB_ENV"

      - name: Import the certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # codesign never downloads the Developer ID G2 intermediate; it must already be trusted here.
          # The runner image is expected to ship it in the System keychain (SHA-1 of the public certificate).
          security find-certificate -a -Z -c "Developer ID Certification Authority" /Library/Keychains/System.keychain \
            | grep -q 5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635 \
            || { echo "::error::this runner image has no Developer ID G2 intermediate in the System keychain, codesign cannot build the chain"; exit 1; }

      - name: Sign
        run: |
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the keychain"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$identity" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'flags=0x10000(runtime)' \
            || { echo "::error::the signature lacks the hardened runtime flag"; exit 1; }

      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" --wait --timeout 10m --output-format json) || true
          status=$(jq -r '.status // "no answer"' <<< "$result")
          echo "notarization: $status"
          if [ "$status" != Accepted ]; then
            id=$(jq -r '.id // empty' <<< "$result")
            [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}" | jq '.issues'
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # Package from the stapled app, then check the zip itself the way a user's Mac will.
      - name: Package
        run: |
          out="$RUNNER_TEMP/out"
          zip="Recodec-$VERSION.zip"
          mkdir "$out"
          ditto -c -k --keepParent "$APP" "$out/$zip"
          (cd "$out" && shasum -a 256 "$zip" > "$zip.sha256" && cat "$zip.sha256")
          mkdir "$RUNNER_TEMP/unzipped"
          ditto -x -k "$out/$zip" "$RUNNER_TEMP/unzipped"
          xcrun stapler validate "$RUNNER_TEMP/unzipped/Recodec.app"
          spctl --assess --type execute "$RUNNER_TEMP/unzipped/Recodec.app"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$OUT/Recodec-$VERSION.zip" "$OUT/Recodec-$VERSION.zip.sha256" \
            --title "Recodec $VERSION" --verify-tag --generate-notes \
            --notes "Notarized by Apple. Architectures: $ARCHS. macOS 13 or later. Needs ffmpeg: \`brew install ffmpeg\`. SHA-256 in the .sha256 file."

      - name: Rehearsal ends here
        if: github.ref_type != 'tag'
        run: |
          echo "Rehearsal done. Recodec-$VERSION.zip was signed, notarized, stapled and verified; nothing was published."
