name: MediaConverter
options:
  bundleIdPrefix: com.emizuki
  deploymentTarget:
    macOS: "13.0"
packages:
  MediaConverterCore:
    path: Packages/MediaConverterCore
targets:
  MediaConverter:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MediaConverter
        CFBundleDisplayName: Media Converter
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audiovisual-content]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        NSServices:
          - NSMenuItem:
              default: Convert Media
            NSMessage: convertMedia
            NSPortName: MediaConverter
            NSSendFileTypes:
              - public.movie
              - public.audiovisual-content
              - public.audio
    dependencies:
      - package: MediaConverterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emizuki.MediaConverter
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
